spring.application.name=accounts
server.port=8081
server.servlet.context-path=/accounts

# Activates 'local' profile automatically on your machine unless overridden
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Swagger / OpenAPI Configuration (Disabled by default for safety)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

logging.level.com.example.accounts=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{clientType}] [%X{userEmail}] %logger{40} : %msg%n