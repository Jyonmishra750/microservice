# Local H2 settings (in-memory or file-based so data persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/accounts_local_db;AUTO_SERVER=TRUE
spring.datasource.driverClassname=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=localPass

# Enable H2 Web Console for local debugging (http://localhost:8081/accounts/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate & SQL visibility for local development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database.platform=org.hibernate.dialect.H2Dialect

# Local API keys or secrets (if using OpenAI, etc.)
#spring.ai.openai.api-key=sk-your-actual-local-key

logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%thread]){blue} %clr([%X{clientType}]){yellow} %clr([%X{userEmail}]){green} %clr(%logger{40}){cyan} : %msg%n
spring.output.ansi.enabled=ALWAYS

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true