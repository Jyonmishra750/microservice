# Local H2 settings (in-memory or file-based so data persists across restarts)
spring.datasource.url=jdbc:h2:mem:accounts_local_db
spring.datasource.username=sa
spring.datasource.password=localpass

# Enable H2 Web Console for local debugging (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate & SQL visibility for local development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local API keys or secrets (if using OpenAI, etc.)
#spring.ai.openai.api-key=sk-your-actual-local-key

logging.level.com.example.accounts=DEBUG

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true